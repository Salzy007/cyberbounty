<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06070d">
<title>CyberBounty — управление</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<script src="nocopy.js?v=5967e5c0"></script>
</head>
<body class="adm">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2.5"/></symbol>
</defs></svg>
<div class="bg" aria-hidden="true"><div class="bg__orbs"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div><div class="bg__grid"></div></div>

<header class="top stuck">
  <div class="wrap top__in">
    <a class="logo" href="index.html" aria-label="На сайт">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffb21e" stroke-width="2.2" stroke-linecap="round"><g class="ring"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3.2 2.6"/></g><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/><circle cx="12" cy="12" r="2" fill="#35e6ff" stroke="none"/></svg>
      <span>CYBER<b>BOUNTY</b></span><em class="adm__tag">ADMIN</em>
    </a>
    <div class="top__tools"><a class="chip-btn" href="index.html"><span>На сайт</span></a><button class="chip-btn" id="out" type="button" hidden><span>Выйти</span></button></div>
  </div>
</header>

<main class="wrap adm__main">
  <section class="adm__login" id="login" hidden>
    <form class="modal__card" id="loginForm" novalidate>
      <h3>Вход для владельца</h3>
      <p class="muted-s">Пароль лежит в файле .env (ADMIN_PASSWORD).</p><p class="muted-s" id="demoHint" hidden>Демо-версия: пароль — <b>demo</b>. Видны только брони из этого браузера.</p>
      <label class="field"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="field__err" id="loginErr" role="alert" hidden></p>
      <button class="btn btn--hot btn--block" type="submit"><span class="btn__t">Войти</span><i class="spin" aria-hidden="true"></i></button>
    </form>
  </section>

  <section class="adm__app" id="app" hidden>
    <h1>Управление клубом</h1>
    <div class="days" id="days" role="listbox" aria-label="День"></div>
    <div class="kpis">
      <div class="kpi"><span>Брони</span><b id="kN">0</b></div>
      <div class="kpi"><span>Выручка за день</span><b id="kSum">0</b></div>
      <div class="kpi"><span>Отменённых всего</span><b id="kOff">0</b></div>
    </div>
    <div class="adm__grid">
      <div class="card">
        <div class="adm__h"><h2>Брони дня</h2><button class="mini" id="clear" type="button" hidden>Стереть отменённые</button></div>
        <div class="list" id="list"></div>
      </div>
      <div class="adm__col">
        <div class="card"><h2>Цена за час</h2><div class="prices" id="prices"></div></div>
        <div class="card"><h2>Свободные места</h2><p class="muted-s" id="freeNote">Свободные окна выбранного дня.</p><div id="free"></div></div>
      </div>
    </div>
  </section>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="demo.js"></script>
<script src="admin.js" defer></script>
</body>
</html>
